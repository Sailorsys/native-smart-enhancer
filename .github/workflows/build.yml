name: Build Native SO Library

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r25c

      - name: Download OpenCV SDK
        run: |
          wget -q https://github.com/opencv/opencv/releases/download/4.8.0/opencv-4.8.0-android-sdk.zip
          unzip -q opencv-4.8.0-android-sdk.zip
          mv OpenCV-android-sdk opencv-android-sdk

      - name: Build C++ Library with CMake
        run: |
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)

      - name: Extract libc++_shared.so from NDK
        run: |
          LIBCXX=$(find ${ANDROID_NDK_HOME} -name "libc++_shared.so" | grep -E "aarch64|arm64" | head -n 1)
          cp "$LIBCXX" build/

      - name: Upload .so Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-libraries-arm64-v8a
          path: |
            build/libsmart_enhancer.so
            build/libc++_shared.so
